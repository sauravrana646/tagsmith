name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast fail on secrets before spending cycles on lint/tests.
  # Prefer Gitleaks as the merge gate (see docs/CONTRIBUTING.md).
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required by gitleaks-action to annotate PRs when secrets are found.
      pull-requests: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect private key / credential files
        run: |
          set -euo pipefail
          echo "Scanning for committed credential filenames..."
          if git ls-files | grep -E '(^|/)\.env$|(^|/)credentials\.json$|(^|/)token\.json$|\.pem$|\.p12$'; then
            echo "::error::Sensitive-looking files are tracked by git"
            exit 1
          fi
          echo "No sensitive filenames tracked."

  lint-test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  security:
    name: Dependency and SAST
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-emit-project --no-dev --no-hashes -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --strict

      - name: Bandit (Python SAST)
        run: uv run bandit -r src -ll -q -c pyproject.toml

  # Single required status check for branch protection on `main`.
  # GitHub → Settings → Branches → Protect `main` →
  # Require status checks to pass → require "quality-gate".
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, lint-test, security]
    steps:
      - name: Enforce all CI jobs passed
        run: |
          set -euo pipefail
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "lint-test: ${{ needs.lint-test.result }}"
          echo "security: ${{ needs.security.result }}"

          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::Secret scan failed — merge blocked (Gitleaks / credential filenames)."
            exit 1
          fi
          if [ "${{ needs.lint-test.result }}" != "success" ]; then
            echo "::error::Lint/typecheck/tests failed — merge blocked."
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::Dependency/SAST security job failed — merge blocked."
            exit 1
          fi
          echo "All quality gates passed."
