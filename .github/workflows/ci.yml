name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  security:
    name: Security and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required by gitleaks-action to annotate PRs when secrets are found.
      pull-requests: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-emit-project --no-dev --no-hashes -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --strict

      - name: Bandit (Python SAST)
        run: uv run bandit -r src -ll -q -c pyproject.toml

      - name: Detect private key / credential files
        run: |
          set -euo pipefail
          echo "Scanning for committed credential filenames..."
          if git ls-files | grep -E '(^|/)\.env$|(^|/)credentials\.json$|(^|/)token\.json$|\.pem$|\.p12$'; then
            echo "::error::Sensitive-looking files are tracked by git"
            exit 1
          fi
          echo "No sensitive filenames tracked."
