[project]
name = "tagsmith"
version = "0.1.0"
description = "Classify unread Gmail into a managed taxonomy with human-approved category growth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Saurav Rana" }]
keywords = ["gmail", "llm", "classification", "pydantic-ai", "cli"]
dependencies = [
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pydantic-ai>=0.0.55",
  "sqlmodel>=0.0.22",
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "pyyaml>=6.0.2",
  "html2text>=2024.2.26",
  "platformdirs>=4.3.0",
  "python-dotenv>=1.0.1",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "mcp>=1.2.0",
]

[project.scripts]
tagsmith = "tagsmith.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagsmith"]

[tool.hatch.build.targets.wheel.force-include]
"src/tagsmith/taxonomy/seed.yaml" = "tagsmith/taxonomy/seed.yaml"
"src/tagsmith/classify/builtin_rules.yaml" = "tagsmith/classify/builtin_rules.yaml"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "pip-audit>=2.7.0",
  "bandit>=1.8.0",
]
observability = [
  "logfire>=3.0.0",
]
product = [
  "stripe>=11.0.0",
  "psycopg[binary]>=3.2.0",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"evals/generate_golden_set.py" = ["E501", "RUF001"]
# FastAPI idiomatic Depends() defaults.
"src/tagsmith/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tagsmith"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "google.*",
  "googleapiclient.*",
  "google_auth_oauthlib.*",
  "html2text.*",
  "logfire.*",
  "mcp.*",
  "stripe.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tagsmith.classify.agent"]
disable_error_code = ["arg-type"]
